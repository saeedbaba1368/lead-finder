[project]
name = "leadfinder"
version = "0.7.1"
description = "leadfinder: FastAPI service with settings, logging, CLI, database layer, URL policy engine, sitemap discovery, an async HTTP client (httpx), a BFS internal-link crawler and HTML content parsing."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leadfinder = "app.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
